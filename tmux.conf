# remap prefix from 'C-b' to 'C-a'
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# keep mouse scrolling
setw -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# TPM automatic install
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Plugin configurations
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- Orchestrator Improvements ---

# 1. Dynamic Status Bar: Shows the Git branch of the active worktree
set -g status-interval 5
set -g status-right-length 100
set -g status-right "#[fg=green] #S #[fg=white]| #[fg=yellow]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'no-git') #[fg=white]| %H:%M "

# 2. The "Nuke" Shortcut: Prefix + X
# This kills the current window AND attempts to remove the associated worktree
# It assumes your worktrees are in a folder named 'worktrees' relative to your main repo
bind X confirm-before -p "Kill window and remove worktree? (y/n)" "run-shell 'tmux_path=#{pane_current_path}; tmux kill-window; git worktree remove \$tmux_path'"
